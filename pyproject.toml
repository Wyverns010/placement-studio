[project]
name = "placement-studio"
version = "0.1.0"
description = "Describe a business in a sentence; get ranked publishers, persona-tuned ads and an explained campaign config."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "pytest>=9.2.0",
]
# Optional Laya gate (GATE_IMPL=laya): uv sync --group laya. Linux pulls CPU-only torch.
laya = [
    "laya",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["laya: needs the laya package and its checkpoint (uv sync --group laya)"]
