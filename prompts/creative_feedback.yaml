# Text the app sends back to the creative model (and shows as violation chips) when code rejects an ad.
# Loaded by app.prompts.feedback(key, **slots); templates use str.format slots.
retry_preamble: "\n\nYour previous ad broke the rules. Rewrite it and fix every problem: {problems}"
other_headlines: "\n\nHeadlines already used by the other personas; yours must differ in wording and angle: {headlines}"
missing: "missing creative"
headline_duplicate: "headline duplicates {name}'s — write a different one"
headline_product: "headline is just the product name"
fact_number: "number '{number}' is not in the advertiser's text"
fact_claim: "claim '{word}' is not in the advertiser's text"
length: "{field} is {n} characters; the limit is {limit}"
generic_age: "'{phrase}' restates the targeting (an age range); speak to what this persona wants instead"
generic_audience: "'{phrase}' restates the targeting; the persona knows who they are, so speak to what they want"
generic_price_band: "'{phrase}' is a price band, not a benefit; use a concrete detail from the facts instead"
generic_phrase: "'{phrase}' is filler; replace it with a concrete detail from the facts"

# Labels and slot defaults used when filling creative.md and clarify.md
none: "none"
product_default: "not stated"
facts_default: "- (no specific facts were extracted)"
no_others: "- (none; this is the only persona)"
other_persona_line: "- {name}: top messaging preference: {preference}"
clarify_unknowns_default: "- what the business sells, who buys it, price"
persona_block: |-
  ## persona_id: {id} ({name})
  Description: {description}
  Category affinities: {affinities}
  Messaging preferences: {preferences}
  Disinterested in: {disinterested}
publisher_block: |-
  ## Publisher: {name}
  Category: {category}
  Audience: ages {age_min}-{age_max}, {gender}, {income} income
  Average order value: ${aov}
  Notes: {notes}
