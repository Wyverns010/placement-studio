publisher:
  weights: {category: 0.45, audience: 0.20, income: 0.15, aov: 0.20}
  category_scores: {primary: 1.0, subcategory: 0.85, same_category: 0.70, adjacent: 0.5, attribute: 0.20}
  audience_weights: {age: 0.7, gender: 0.3}
  income_targets: {value: 1, mid: 1.5, premium: 2.5, luxury: 3}   # brief price tier -> target income rank
  income_scale: 2               # income factor = 1 - |rank - target| / scale
  aov_log2_scale: 2             # aov factor = 1 - |log2(price/aov)| / scale, price above AOV
  aov_below_log2_scale: 5       # same, price below AOV (fits inside a bigger basket: milder)
  attribute_tags: [subscription, dtc, personalized, sustainable, natural, organic, non_toxic, gifting]
  no_category_penalty: 0.5      # fit *= this when category level is attribute or none
  aov_gate_floor: 0.4           # when price known: fit *= floor + (1-floor)*aov_factor
  unknown_factor: 0.6           # factor value when the brief lacks the needed field
  cutoff: 0.40
  max_recommended: 5
  weak_fit_min_recommended: 1   # weak_fit only when no publisher clears the cutoff (the brief's examples #3, #13: single-publisher categories proceed)
  weak_fit_show: 3
persona:
  weights: {affinity: 0.5, price: 0.2, age: 0.3}
  affinity_scores: {direct: 1.0, adjacent: 0.5}
  price_ideal: {value: 2, mid: 1, premium: 0.5, luxury: 0}   # brief price tier -> ideal persona price_rank
  price_scale: 2                # price factor = 1 - |ideal - price_rank| / scale
  conflict_penalty: 0.35
  cutoff: 0.45
  min: 3
  max: 5
budget:
  min_usd: 500
  max_usd: 5000000
  assumed_cpm_usd: 12
  min_share: 0.10
  weak_fit_test_fraction: 0.20  # weak fit: recommend this share of the full budget, as a test
  conversions_per_line_item: 50 # monthly conversions a line item needs for a CPA bid to optimise
  round_to_usd: 500             # recommended budget rounds to the nearest multiple of this
bid:
  cpa_fraction_of_order_value: 0.35
  subscription_ltv_multiplier: 2.0
  guardrail_cpa_multiple: 1.5
  guardrail_min_impressions: 2000
frequency:                      # cap per person, by how considered the purchase is
  by_price_tier:
    value: {impressions: 5, per_days: 7}
    mid: {impressions: 4, per_days: 7}
    premium: {impressions: 3, per_days: 14}
    luxury: {impressions: 2, per_days: 21}
    unknown: {impressions: 3, per_days: 7}
  subscription_extra: 1         # a subscription start earns one more reminder
  weak_fit_reduction: 1         # a weak-fit test shows fewer
  min_impressions: 1
gate:
  proceed_threshold: 0.70
  no_signal_threshold: 0.30
  business_threshold: 0.50
  category_disagreement_factor: 0.80
  laya:                         # GATE_IMPL=laya only; fit with evals.calibrate --gate laya
    proceed_threshold: 0.45
    no_signal_threshold: 0.4
    business_threshold: 0.65
creative:
  headline_max_chars: 60
  body_max_chars: 160
  cta_max_chars: 24
  headline_similarity: 0.8      # token-set Jaccard at or above this counts as a duplicate headline
  claim_words: [clinically, proven, cure, guaranteed, "#1", doctor, vet-recommended, award]
  # generic copy (headline/body): sent back once unless the advertiser wrote the phrase
  banned_phrases: [high-quality, perfect for, look no further, elevate, unlock, game-changer]
  note_max_chars: 200           # regenerate note from the advertiser (treated as data)
  audience_words: [women, men, moms, mums, mothers, dads, fathers, parents, seniors, millennials, gen z, boomers, teens]
input:
  max_chars: 1500
audience:
  age_floor: 18                 # fills a missing lower age bound ("under 35" -> 18-35)
  age_ceiling: 80               # fills a missing upper age bound ("over 50" -> 50-80)
ratelimit:
  per_client_runs: 20           # live (paid) runs per client per window
  per_client_window_s: 600
  global_runs_per_hour: 200     # process-wide cap on uncached live (paid) runs
  cost_stage1: 1                # runs charged per call: stage 1 (understand + gate + match)
  cost_creatives: 2             # stage 2: one creative call per persona (3-5 calls)
  cost_regenerate: 1            # stage 2: rewrite one ad
