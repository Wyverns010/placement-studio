publisher:
  weights: {category: 0.45, audience: 0.20, income: 0.15, aov: 0.20}
  category_scores: {primary: 1.0, subcategory: 0.85, same_category: 0.70, adjacent: 0.5, attribute: 0.20}
  audience_weights: {age: 0.7, gender: 0.3}
  income_targets: {value: 1, mid: 1.5, premium: 2.5, luxury: 3}   # brief price tier -> target income rank
  income_scale: 2               # income factor = 1 - |rank - target| / scale
  aov_log2_scale: 2             # aov factor = 1 - |log2(price/aov)| / scale, price above AOV
  aov_below_log2_scale: 5       # same, price below AOV (fits inside a bigger basket: milder)
  attribute_tags: [subscription, dtc, personalized, sustainable, natural, organic, non_toxic, gifting]
  no_category_penalty: 0.5      # fit *= this when category level is attribute or none
  aov_gate_floor: 0.4           # when price known: fit *= floor + (1-floor)*aov_factor
  unknown_factor: 0.6           # factor value when the brief lacks the needed field
  # persona-affinity terms that are no publisher's category/subcategory -> the publisher category
  # they belong to; a brief category matching only this way scores same_category, an adjacent one
  # scores adjacent. Ambiguous terms
  # (fitness, wellness, recovery, travel, small_batch, family/kids products, subscription_*) stay out.
  affinity_parents:
    home_decor: home
    home_goods: home
    classic_apparel: apparel
    fashion: apparel
    sustainable_apparel: apparel
    premium_basics: apparel
    clean_beauty: beauty
    organic_grocery: groceries
    premium_grocery: groceries
    gourmet_food: groceries
    pet_health: pet
    quick_commerce: instant_delivery
    fitness_services: wellness_services
  cutoff: 0.40
  max_recommended: 5
  weak_fit_min_recommended: 1   # weak_fit only when no publisher clears the cutoff (the brief's examples #3, #13: single-publisher categories proceed)
  weak_fit_show: 3
match:
  impl: formula                 # formula | graph (app/graph.py). Measured: evals/GRAPH_COMPARISON.md
graph:                          # match.impl: graph only. Values chosen on the train split (evals/GRAPH_COMPARISON.md)
  # edge weights: publisher-category (primary), publisher-subcategory, publisher-attribute tag,
  # subcategory/interest term-parent category, persona-affinity term, persona-publisher (x audience fit)
  edges: {primary: 1.0, subcategory: 0.85, attribute: 0.20, parent: 0.70, affinity: 1.0, audience: 0.4}
  audience_min: 0.60            # persona-publisher edge only when their audience fit is at least this
  seed: {category: 1.0, adjacent: 0.5}   # walk starts: brief categories, adjacent categories
  through: {term: 0.5, persona: 0.2, publisher: 0.3}  # x when a path passes THROUGH a node of this kind
  max_hops: 3                   # longest path counted (term -> persona -> publisher is 2)
  min_path_weight: 0.05         # paths weaker than this are dropped while walking
  paths_combined: 3             # strongest distinct paths combined per node
  corroboration: 0.25           # extra paths count at this share: 1 - (1-w1) * prod(1 - c*wk)
  penalty_below: 0.35           # graph score below this -> publisher no_category_penalty applies
  paths_shown: 2                # paths explained per recommended publisher / persona
persona:
  weights: {affinity: 0.5, price: 0.2, age: 0.3}
  affinity_scores: {direct: 1.0, adjacent: 0.5}
  price_ideal: {value: 2, mid: 1, premium: 0.5, luxury: 0}   # brief price tier -> ideal persona price_rank
  price_scale: 2                # price factor = 1 - |ideal - price_rank| / scale
  conflict_penalty: 0.35
  cutoff: 0.45
  min: 3
  max: 5
budget:
  min_usd: 500
  max_usd: 5000000
  assumed_cpm_usd: 12
  min_share: 0.10
  weak_fit_test_fraction: 0.20  # weak fit: recommend this share of the full budget, as a test...
  weak_fit_test_max_usd: 3000   # ...capped here (a test should stay cheap), then rounded
  conversions_per_line_item: 50 # monthly conversions a line item needs for a CPA bid to optimise
  round_to_usd: 500             # (> 0) recommended budget rounds to the nearest multiple of this
bid:
  cpa_fraction_of_order_value: 0.35
  subscription_ltv_multiplier: 2.0
  guardrail_cpa_multiple: 1.5
  guardrail_min_impressions: 2000
frequency:                      # cap per person, by how considered the purchase is
  by_price_tier:
    value: {impressions: 5, per_days: 7}
    mid: {impressions: 4, per_days: 7}
    premium: {impressions: 3, per_days: 14}
    luxury: {impressions: 2, per_days: 21}
    unknown: {impressions: 3, per_days: 7}
  subscription_extra: 1         # a subscription start earns one more reminder
  weak_fit_reduction: 1         # a weak-fit test shows fewer...
  weak_fit_max_per_days: 14     # ...over a window no longer than this (a short, front-loaded test)
  min_impressions: 1
gate:
  proceed_threshold: 0.70
  no_signal_threshold: 0.30
  business_threshold: 0.50
  category_disagreement_factor: 0.80
  laya:                         # GATE_IMPL=laya only; fit with evals.calibrate --gate laya
    proceed_threshold: 0.45
    no_signal_threshold: 0.4
    business_threshold: 0.65
creative:
  headline_max_chars: 60
  body_max_chars: 160
  cta_max_chars: 30
  headline_similarity: 0.8      # token-set Jaccard at or above this counts as a duplicate headline
  claim_words: [clinically, proven, cure, guaranteed, "#1", doctor, vet-recommended, award]
  # generic copy (headline/body): sent back once unless the advertiser wrote the phrase
  banned_phrases: [high-quality, perfect for, look no further, elevate, unlock, game-changer]
  age_range_bounds: [13, 99]    # a bare "NN-NN" in copy counts as an age range only inside these
  parrot_ngram: 6               # headline/body copying this many consecutive advertiser words is sent back
  parrot_sentence_min_words: 4  # ...as is a whole advertiser sentence of at least this many words
  note_max_chars: 200           # regenerate note from the advertiser (treated as data)
  audience_words: [women, men, moms, mums, mothers, dads, fathers, parents, seniors, millennials, gen z, boomers, teens]
clarify:
  max_questions: 3              # clarify questions kept from the LLM
  max_options: 5                # tap-able options kept per question
  min_options: 2                # a question with fewer options is dropped
stage1:
  top_publishers_shown: 5       # publishers streamed in the stage-1 "publishers" event
  clarify_publishers_shown: 3   # clarify outcome: faded best guess, top N only
api:
  replay_delay_s: 0.3           # pause between replayed stage events for a cached sample
llm:
  timeout_s: 25                 # OpenAI client timeout per request (no SDK retries)
input:
  max_chars: 1500
  max_answers: 5                # clarify answers appended to the text
  max_answer_chars: 200         # per question and per answer
  max_body_bytes: 262144        # request body cap (256 KB)
  brief_product_max_chars: 120  # stage 2/3 echo checks (defence in depth behind the stage token)
  brief_list_max_items: 10      # facts, unknowns
  brief_item_max_chars: 200
  brief_categories_max: 20      # categories, adjacent_categories, conflicts
  brief_age_max: 120
audience:
  age_floor: 18                 # fills a missing lower age bound ("under 35" -> 18-35)
  age_ceiling: 80               # fills a missing upper age bound ("over 50" -> 50-80)
ratelimit:
  per_client_runs: 20           # live (paid) runs per client per window
  per_client_window_s: 600
  global_runs_per_hour: 200     # process-wide cap on uncached live (paid) runs
  cost_stage1: 1                # runs charged per call: stage 1 (understand + gate + match)
  cost_creatives: 2             # stage 2: one creative call per persona (3-5 calls)
  cost_regenerate: 1            # stage 2: rewrite one ad
agents:                         # step agents (app/stepagents). Not in the sample-cache fingerprint:
  enabled: true                 # cached samples are no-steer code results, never agent output
  run_without_steer:            # live runs with no steer: use the agent, or plain code ("code" mode)
    strategist: false           # unsteered agent == code on 121/121 cases, +6 s (evals/AGENT_COMPARISON.md)
    creative: true              # the one switch for step ② (ads and Regenerate)
    media_planner: false        # stage 3 stays free and instant unless the user steers it
  steer_max_chars: 300          # the "Tell the agent…" text (data, never instructions)
  max_turns: {strategist: 10, copywriter: 6, critic: 3, media_planner: 8}
  min_recommended_after_steer: 2  # a steer may narrow the publishers, never below min(this, original count)
  max_share_after_steer: 0.6    # a planner exclusion may not put more than this share in one publisher
  critic_max_rounds: 2          # critic reviews per ad; later review requests are refused
  critic_stop_fraction: 0.7     # once a step has spent this share of its cap, reviews are refused
  creative_est_usd_per_ad: 0.03 # measured ≈$0.03/ad; ads × this over the cap -> code, before spending
  max_cost_usd:                 # cost guard per step run (≈15–20¢ worst case per session); over -> fallback
    strategist: 0.02
    creative: 0.15              # measured mean $0.095, max $0.135 (evals/AGENT_COMPARISON.md)
    media_planner: 0.01
  timeout_s: 30                 # per agent model call (OpenAI client), never more than the step's
  max_retries: 1                # SDK retries per model call, still within step_timeout_s
  step_timeout_s: 90            # whole step; over -> fallback
  max_notes: 6                  # agent_notes kept per step
  note_max_chars: 200
  trace_args_chars: 80          # agent_trace summaries are cut to these lengths
  trace_result_chars: 160
  ratelimit_cost_config: 1      # runs charged for /api/config with a steer (the planner is an LLM)
  prices_per_1m_usd:            # USD per 1M tokens for the cost guard; check OpenAI's price page.
    gpt-5.4-mini: {input: 0.75, cached_input: 0.075, output: 4.5}
    gpt-5.5: {input: 5.0, cached_input: 0.5, output: 30.0}
    default: {input: 5.0, cached_input: 0.5, output: 30.0}   # any other model: priced high
